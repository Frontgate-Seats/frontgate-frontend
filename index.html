<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/frontgate_logo_black.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frontgate</title>
    <script>
      // GitHub Pages SPA redirect restore
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            });
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) +
              (decoded[0] && decoded[0] !== "/"  ? decoded[0] : "") +
              (decoded[1] ? "?" + decoded[1] : "") +
              l.hash
          );
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="frontgate"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
