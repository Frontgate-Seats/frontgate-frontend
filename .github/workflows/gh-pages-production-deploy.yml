name: Deploy Vite React App to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write  # required for gh cache delete

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build
        env:
          VITE_APP_SERVER_URL: ${{ secrets.VITE_APP_SERVER_URL }}
          VITE_APP_SUPABASE_URL: ${{ secrets.VITE_APP_SUPABASE_URL }}
          VITE_APP_SUPABASE_ANON_KEY: ${{ secrets.VITE_APP_SUPABASE_ANON_KEY }}
          VITE_APP_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_APP_SUPABASE_PUBLISHABLE_KEY }}
          VITE_APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.VITE_APP_SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      # After a successful deploy, clear all Actions caches on the main branch.
      # This prevents stale npm/node_modules caches from being used in future
      # builds and ensures the next run always resolves fresh dependencies.
      - name: Clear GitHub Actions caches for this branch
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "Fetching cache keys for branch: ${{ github.ref }}"
          CACHE_IDS=$(gh cache list --ref ${{ github.ref }} --limit 100 --json id --jq '.[].id')
          if [ -z "$CACHE_IDS" ]; then
            echo "No caches found for this branch."
          else
            echo "Deleting caches..."
            for CACHE_ID in $CACHE_IDS; do
              gh cache delete "$CACHE_ID" && echo "Deleted: $CACHE_ID" || echo "Failed to delete: $CACHE_ID"
            done
            echo "Cache cleanup complete."
          fi