<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>FrontGate</title>
    <script>
      // Redirect to index.html, preserving the path and query in sessionStorage
      sessionStorage.setItem(
        "__spa_redirect",
        JSON.stringify({
          path: window.location.pathname,
          search: window.location.search,
          hash: window.location.hash,
        })
      );
      window.location.replace("/");
    </script>
  </head>
  <body></body>
</html>
